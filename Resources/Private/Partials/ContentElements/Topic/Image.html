<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:rkwTemplate="http://typo3.org/ns/RKW/RkwTemplate/ViewHelpers"
    xmlns:rkwEtracker="http://typo3.org/ns/RKW/RkwEtracker/ViewHelpers"
    data-namespace-typo3-fluid="true">

    <f:if condition="{f:count(subject: images)} > 0">
        <span class="topic-media">
            <f:if condition="{data.header_link}">
                <f:then>
                    <rkwEtracker:link.typolink parameter="{data.header_link}">
                        <f:render section="Inner" arguments="{_all}"/>
                    </rkwEtracker:link.typolink>
                </f:then>
                <f:else>
                    <f:render section="Inner" arguments="{_all}"/>
                </f:else>
            </f:if>

            <rkwTemplate:copyright file="{images.0}" class="media-source--topic-desktop"  showMediaSourceOverlay="{settings.showMediaSourceOverlay}" />
            <f:if condition="{images.1}">
                <f:then>
                    <rkwTemplate:copyright file="{images.1}" class="media-source--topic-mobile" showMediaSourceOverlay="{settings.showMediaSourceOverlay}" />
                </f:then>
                <f:else>
                    <rkwTemplate:copyright file="{images.0}" class="media-source--topic-mobile" showMediaSourceOverlay="{settings.showMediaSourceOverlay}" />
                </f:else>
            </f:if>
        </span>
    </f:if>

    <f:comment><!-- ======================================================================== --></f:comment>

    <f:section name="Inner">

        <img class="illu_desk" loading="lazy" src="{f:uri.image(image:images.0,width:'300',height:'240c',cropVariant:'default')}" alt="{data.header}" />

        <f:if condition="{images.1}">
            <f:then>
                <img class="illu_mobile" loading="lazy" src="{f:uri.image(image:images.1,width:'63',height:'50c',cropVariant:'default')}" alt="{data.header}" />
            </f:then>
            <f:else>
                <img class="illu_mobile" loading="lazy" src="{f:uri.image(image:images.0,width:'300',height:'240c',cropVariant:'default')}" alt="{data.header}" />
            </f:else>
        </f:if>
    </f:section>

</html>
